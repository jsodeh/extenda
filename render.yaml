services:
  - type: web
    name: extenda-api
    runtime: node
    plan: free # Free tier as requested
    region: ohio # Default
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm --filter api start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set manually in dashboard
      - key: JWT_SECRET
        sync: false # Set manually in dashboard
      - key: ENCRYPTION_KEY
        sync: false # Set manually in dashboard
      - key: GEMINI_API_KEY
        sync: false # Set manually in dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false 
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_AUTH_REDIRECT_URI
        sync: false
    healthCheckPath: /health
  - type: cron
    name: extenda-scheduler
    runtime: node
    schedule: "* * * * *"
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @extenda/shared build && pnpm --filter api build
    startCommand: node apps/api/dist/scripts/run-scheduler.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_AUTH_CLIENT_SECRET
        sync: false
